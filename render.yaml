services:
  - type: web
    name: lmguard-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: POLICY_FILE
        value: config/policy.yaml
      - key: AGENT_TIMEOUT_SECONDS
        value: "1.0"
      - key: CACHE_MAX_ITEMS
        value: "1000"
      - key: EMBEDDING_PROVIDER
        value: GOOGLE
      - key: LLM_PROVIDER
        value: GOOGLE
      - key: LOG_FILE
        value: /tmp/lmguard_audit.json
      - key: HASH_SALT
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"